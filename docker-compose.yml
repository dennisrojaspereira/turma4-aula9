# Tech Pix.
#   docker compose up -d postgres                       -> so o banco (monolito roda pelo Maven)
#   docker compose --profile app up -d                  -> banco + monolito em container
#   docker compose --profile observability up -d        -> + Prometheus e Grafana (opcional)
services:
  postgres:
    image: postgres:16-alpine
    container_name: techpix-postgres
    # pg_stat_statements: a ferramenta de "quem esta consumindo o banco?" (lab 03)
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
    environment:
      POSTGRES_DB: techpix
      POSTGRES_USER: techpix
      POSTGRES_PASSWORD: techpix
    ports:
      - "5432:5432"
    volumes:
      - techpix-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techpix -d techpix"]
      interval: 5s
      timeout: 3s
      retries: 10

  monolith:
    build:
      context: ./monolith
    image: techpix/monolith:local
    container_name: techpix-monolith
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TECHPIX_DB_HOST: postgres
      TECHPIX_FRAUD_PROFILE: ${TECHPIX_FRAUD_PROFILE:-SIMPLE}
    ports:
      - "8080:8080"
    profiles: ["app"]

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: techpix-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:11.3.0
    container_name: techpix-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    profiles: ["observability"]

volumes:
  techpix-pgdata:
