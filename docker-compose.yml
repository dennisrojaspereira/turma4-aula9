# Tech Pix.
#   docker compose up -d postgres                       -> so o banco (monolito roda pelo Maven)
#   docker compose --profile app up -d                  -> banco + monolito + fraud-service em containers
#   docker compose --profile observability up -d        -> + Prometheus e Grafana (opcional)
services:
  postgres:
    image: postgres:16-alpine
    container_name: techpix-postgres
    # pg_stat_statements: a ferramenta de "quem esta consumindo o banco?" (lab 03)
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
    environment:
      POSTGRES_DB: techpix
      POSTGRES_USER: techpix
      POSTGRES_PASSWORD: techpix
    ports:
      - "5432:5432"
    volumes:
      - techpix-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techpix -d techpix"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    # KRaft, um unico broker, sem ZooKeeper. Suficiente para o laboratorio.
    image: apache/kafka:3.8.0
    container_name: techpix-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Topicos sao criados pelas aplicacoes (3 particoes). Auto-create criaria com 1 e confundiria o consumidor.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: techpix-kraft-cluster-0001
    ports:
      - "9094:9094"     # da maquina: localhost:9094. Entre containers: kafka:9092
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  monolith:
    build:
      context: .
      dockerfile: monolith/Dockerfile
    image: techpix/monolith:local
    container_name: techpix-monolith
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      TECHPIX_DB_HOST: postgres
      KAFKA_BOOTSTRAP: kafka:9092
      TECHPIX_EVENTS_ENABLED: ${TECHPIX_EVENTS_ENABLED:-true}
      TECHPIX_FRAUD_PROFILE: ${TECHPIX_FRAUD_PROFILE:-SIMPLE}
      # Lab 20: TECHPIX_LEDGER_FAIL_AMOUNT=13.37 faz o ledger falhar para esse valor (demo da compensacao)
      TECHPIX_LEDGER_FAIL_AMOUNT: ${TECHPIX_LEDGER_FAIL_AMOUNT:-}
      TECHPIX_FRAUD_MODE: ${TECHPIX_FRAUD_MODE:-LEGACY}
      # Dentro da rede do compose, o nome do servico e o endereco. Sem IP. (Service discovery do Docker, lab 10.)
      TECHPIX_FRAUD_SERVICE_URL: http://fraud-service:8081
      # Lab 22: a seguranca liga com SPRING_PROFILES_ACTIVE=secure (exige o Keycloak do profile auth).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      # Issuer mismatch: o navegador fala com o Keycloak em http://localhost:8180, mas este container
      # fala em http://keycloak:8080 (o nome do servico so resolve dentro da rede do compose).
      # Resolvemos separando as URLs: TECHPIX_KEYCLOAK_PUBLIC_URL e o que o NAVEGADOR usa (redirect do
      # login) e TECHPIX_KEYCLOAK_ISSUER e o que o MONOLITO usa (token, JWKS, userinfo). O Spring valida
      # o token pela assinatura (jwk-set-uri), nao pelo campo iss - ver application-secure.yml, item 4 do lab 22.
      TECHPIX_KEYCLOAK_ISSUER: ${TECHPIX_KEYCLOAK_ISSUER:-http://keycloak:8080/realms/techpix}
      TECHPIX_KEYCLOAK_PUBLIC_URL: ${TECHPIX_KEYCLOAK_PUBLIC_URL:-http://localhost:8180}
    ports:
      - "8080:8080"
    profiles: ["app"]

  fraud-service:
    build:
      context: .
      dockerfile: fraud-service/Dockerfile
    image: techpix/fraud-service:local
    container_name: techpix-fraud-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      FRAUD_DB_HOST: postgres
      KAFKA_BOOTSTRAP: kafka:9092
      FRAUD_EVENTS_ENABLED: ${FRAUD_EVENTS_ENABLED:-true}
      # Etapa 12+: banco proprio. Para a etapa 8 (banco compartilhado):
      #   FRAUD_DB_NAME=techpix FRAUD_DB_USER=techpix FRAUD_DB_PASSWORD=techpix FRAUD_FLYWAY_ENABLED=false FRAUD_HISTORY_SOURCE=LEGACY_SCHEMA
      FRAUD_DB_NAME: ${FRAUD_DB_NAME:-fraud_db}
      FRAUD_DB_USER: ${FRAUD_DB_USER:-fraud}
      FRAUD_DB_PASSWORD: ${FRAUD_DB_PASSWORD:-fraud}
      FRAUD_FLYWAY_ENABLED: ${FRAUD_FLYWAY_ENABLED:-true}
      FRAUD_HISTORY_SOURCE: ${FRAUD_HISTORY_SOURCE:-LOCAL_VIEW}
      FRAUD_WARMUP_SECONDS: ${FRAUD_WARMUP_SECONDS:-0}
    ports:
      - "8081:8081"
    profiles: ["app"]

  keycloak:
    # Lab 22: identidade centralizada (OIDC).
    #   docker compose --profile auth up -d keycloak    -> admin console em http://localhost:8180 (admin/admin)
    # O realm techpix (clients, roles, usuarios maria/joao) e importado de docker/keycloak/techpix-realm.json.
    image: quay.io/keycloak/keycloak:26.0
    container_name: techpix-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      # Nomes novos do Keycloak 26:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Nomes antigos, mantidos por compatibilidade com versoes anteriores da imagem:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      # Liga o endpoint de health na porta de management (9000), usado pelo healthcheck abaixo.
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # A imagem do Keycloak 26 nao tem curl; testamos a porta de management com /dev/tcp do bash.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo ok"]
      interval: 5s
      timeout: 3s
      retries: 36
    # Profile proprio para nao pesar o --profile app dos labs antigos.
    profiles: ["auth"]

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: techpix-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:11.3.0
    container_name: techpix-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # Abrir http://localhost:3000 cai direto na Visao Geral (lista de todos os dashboards)
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/geral/overview.json
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    profiles: ["observability"]

volumes:
  techpix-pgdata:
