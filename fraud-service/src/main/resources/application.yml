spring:
  application:
    name: techpix-fraud-service
  datasource:
    # A partir da etapa 12: banco proprio (fraud_db, usuario fraud). Para reproduzir a etapa 8 (banco compartilhado):
    #   FRAUD_DB_NAME=techpix FRAUD_DB_USER=techpix FRAUD_DB_PASSWORD=techpix FRAUD_FLYWAY_ENABLED=false FRAUD_HISTORY_SOURCE=LEGACY_SCHEMA
    url: jdbc:postgresql://${FRAUD_DB_HOST:localhost}:${FRAUD_DB_PORT:5432}/${FRAUD_DB_NAME:fraud_db}
    username: ${FRAUD_DB_USER:fraud}
    password: ${FRAUD_DB_PASSWORD:fraud}
    hikari:
      maximum-pool-size: ${FRAUD_DB_POOL:10}
  flyway:
    # Ligado: o schema de fraud_db pertence ao Fraud Service. Desligado na etapa 8, quando o schema era do monolito.
    enabled: ${FRAUD_FLYWAY_ENABLED:true}

server:
  port: ${SERVER_PORT:8081}
  tomcat:
    threads:
      max: ${FRAUD_HTTP_THREADS:50}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        # Expõe /actuator/health/liveness e /actuator/health/readiness (lab 12)
        enabled: true
      group:
        readiness:
          include: readinessState,db,warmup
        liveness:
          include: livenessState
  metrics:
    distribution:
      percentiles-histogram:
        fraud.evaluation: true
        fraud.rule: true
      percentiles:
        fraud.evaluation: 0.5,0.95,0.99

fraud:
  reject-threshold: 70
  provider-latency-ms: ${FRAUD_PROVIDER_LATENCY_MS:30}
  ml-iterations: ${FRAUD_ML_ITERATIONS:200000}
  warmup-seconds: ${FRAUD_WARMUP_SECONDS:0}
  # LOCAL_VIEW: historico vem de payment_history (fraud_db). LEGACY_SCHEMA: le payments do banco do monolito (etapa 8).
  history-source: ${FRAUD_HISTORY_SOURCE:LOCAL_VIEW}
  blacklist-refresh-ms: 30000

logging:
  level:
    com.techpix.fraudservice: ${FRAUD_LOG_LEVEL:INFO}
