spring:
  application:
    name: techpix-monolith
  datasource:
    url: jdbc:postgresql://${TECHPIX_DB_HOST:localhost}:${TECHPIX_DB_PORT:5432}/${TECHPIX_DB_NAME:techpix}
    username: ${TECHPIX_DB_USER:techpix}
    password: ${TECHPIX_DB_PASSWORD:techpix}
    hikari:
      maximum-pool-size: ${TECHPIX_DB_POOL:10}
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      max: ${TECHPIX_HTTP_THREADS:50}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        payment.create: true
        fraud.evaluation: true
        fraud.rule: true
      percentiles:
        payment.create: 0.5,0.95,0.99
        fraud.evaluation: 0.5,0.95,0.99
        fraud.rule: 0.5,0.95

techpix:
  fraud:
    reject-threshold: 70
    # SIMPLE = a Tech Pix do inicio (5 regras). HEAVY = depois do crescimento (17 regras).
    profile: ${TECHPIX_FRAUD_PROFILE:SIMPLE}
    provider-latency-ms: ${TECHPIX_FRAUD_PROVIDER_LATENCY_MS:30}
    ml-iterations: ${TECHPIX_FRAUD_ML_ITERATIONS:200000}
    # Feature flag do Strangler: LEGACY = Fraud in-process; PARALLEL = legado decide, novo em shadow; NEW = so o remoto.
    mode: ${TECHPIX_FRAUD_MODE:LEGACY}
    parallel:
      shadow-timeout-ms: ${TECHPIX_FRAUD_SHADOW_TIMEOUT_MS:1500}
      threads: 8
      queue-size: 100
    remote:
      url: ${TECHPIX_FRAUD_SERVICE_URL:http://localhost:8081}
      connect-timeout-ms: ${TECHPIX_FRAUD_CONNECT_TIMEOUT_MS:500}
      read-timeout-ms: ${TECHPIX_FRAUD_READ_TIMEOUT_MS:2000}

logging:
  level:
    com.techpix: INFO
    # DEBUG mostra uma linha por regra de Fraud; util para investigar, ruidoso sob carga.
    com.techpix.fraud: ${TECHPIX_FRAUD_LOG_LEVEL:INFO}
