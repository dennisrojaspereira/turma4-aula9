global:
  scrape_interval: 5s

scrape_configs:
  # Monolito rodando pelo Maven na maquina do aluno (host) ou em container (profile app).
  - job_name: techpix-monolith
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080", "monolith:8080", "host.docker.internal:8090"]
        labels:
          app: monolith
  # Fraud Service, quando existir (a partir do lab 08).
  - job_name: techpix-fraud-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081", "fraud-service:8081", "host.docker.internal:8091"]
        labels:
          app: fraud-service
  # Aula 9: o simulador do lab "Cade o Pix?" reencena o incidente em loop de 20 min.
  # Alimenta o dashboard "Aula 9 - Cade o Pix?" no Grafana.
  - job_name: techpix-lab9
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          app: lab9
  # Synthetic monitoring (Aula 9): o robo que refaz a jornada do Pix.
  - job_name: techpix-synthetic
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8098"]
        labels:
          app: synthetic
